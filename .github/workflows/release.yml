name: release

# Build static linux/amd64 + linux/arm64 binaries for master and agent and
# publish them to a GitHub Release on every v* tag. The install.sh script
# pulls the agent binary from releases/latest/download/<fixed-name>.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (so master embeds the real SPA)
        working-directory: web
        run: |
          npm ci
          npm run build
          rm -rf ../internal/web/dist/assets
          cp -r dist/. ../internal/web/dist/

      - name: Build binaries (CGO disabled, static)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/traffic-keeper-master-linux-${{ matrix.arch }}" ./cmd/master
          go build -trimpath -ldflags "-s -w" -o "dist/traffic-keeper-agent-linux-${{ matrix.arch }}" ./cmd/agent

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/traffic-keeper-master-linux-amd64
            dist/traffic-keeper-master-linux-arm64
            dist/traffic-keeper-agent-linux-amd64
            dist/traffic-keeper-agent-linux-arm64
          generate_release_notes: true
